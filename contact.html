<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carthage Tech | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">CARTHAGE.TECH</a>
      <ul class="nav-links">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="projets.html">Projets</a></li>
        <li><a href="apropos.html">À Propos</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="page-title">
      <h2>Contactez-Nous</h2>
      <p>Un projet en tête ? Discutons-en autour d'un café ou en ligne.</p>
    </div>

    <form class="contact-form" action="#" method="POST">
      <div class="form-group">
        <label for="nom">Nom Complet</label>
        <input type="text" id="nom" name="nom" placeholder="Ex: Ahmed Tounsi" required>
      </div>
      <div class="form-group">
        <label for="email">Adresse Email</label>
        <input type="email" id="email" name="email" placeholder="ahmed@exemple.tn" required>
      </div>
      <div class="form-group">
        <label for="message">Votre Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Parlez-nous de votre projet..." required></textarea>
      </div>
      <button type="submit" class="btn" style="width: 100%;">Envoyer le message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Carthage Tech - Les Berges du Lac, Tunis. Tous droits réservés.</p>
  </footer>

</body>
</html>
